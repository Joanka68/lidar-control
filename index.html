<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiDAR 3D · Control BLE</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#cdd6f4;background:#1e1e2e}
body{margin:0;padding:24px 18px 40px;max-width:620px;margin-inline:auto}
h1{text-align:center;font-size:1.75rem;margin:22px 0 6px}
small{display:block;text-align:center;color:#a6adc8;margin-bottom:24px}
button{border:0;border-radius:18px;padding:20px 10px;font-size:1.06rem;font-weight:750;color:#11111b;cursor:pointer}
button:disabled{opacity:.36}
.connect{width:100%;background:#a6e3a1;margin-bottom:18px}
.status{background:#11111b;padding:15px;border-radius:16px;min-height:50px;white-space:pre-wrap;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}
.normal{background:#a6e3a1}.precise{background:#89b4fa}.cancel{background:#f9e2af}.usb{background:#f5c2e7}
.desktop{background:#bac2de}.off{background:#f38ba8}
.note{font-size:.9rem;color:#a6adc8;line-height:1.5;margin-top:20px}
</style></head><body>
<h1>LiDAR 3D</h1><small>Control desde iPhone · Raspberry Pi 5</small>
<button class="connect" id="connect">CONECTAR BLUETOOTH</button>
<div class="status" id="status">Desconectado. Pulsa conectar.</div>
<div class="grid">
<button class="normal cmd" data-cmd="N" disabled>ESCANEO NORMAL<br>60 s</button>
<button class="precise cmd" data-cmd="P" disabled>ESCANEO PRECISO<br>180 s</button>
<button class="cancel cmd" data-cmd="C" disabled>CANCELAR<br>CUENTA ATRÁS</button>
<button class="usb cmd" data-cmd="U" disabled>COPIAR<br>7 ARCHIVOS USB</button>
<button class="desktop cmd" data-cmd="X" disabled>SALIR AL<br>ESCRITORIO</button>
<button class="off" disabled>APAGAR EQUIPO<br>NO DISPONIBLE</button>
</div>
<p class="note">Las órdenes se envían directamente por Bluetooth a la Raspberry. No hay parada remota durante un escaneo. El apagado remoto permanece deshabilitado por seguridad. La pantalla táctil sigue funcionando.</p>
<script>
const SERVICE='7cb5a001-7e5a-42da-b8b0-2a54c81d92a1';
const RX='7cb5a002-7e5a-42da-b8b0-2a54c81d92a1';
let device=null, characteristic=null, sending=false;
const status=document.getElementById('status'), connect=document.getElementById('connect');
function show(msg){status.textContent=msg}
function enabled(yes){document.querySelectorAll('.cmd').forEach(b=>b.disabled=!yes)}
function disconnected(){characteristic=null;enabled(false);connect.textContent='CONECTAR BLUETOOTH';show('Bluetooth desconectado. Pulsa conectar.')}
connect.onclick=async()=>{
  if(!navigator.bluetooth){show('Este navegador no admite Web Bluetooth. Abre la página en Bluefy.');return}
  connect.disabled=true;
  try{
    show('Selecciona joanedu-desktop en el listado Bluetooth…');
    device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE]});
    device.addEventListener('gattserverdisconnected',disconnected);
    show('Conectando con '+(device.name||'Raspberry')+'…');
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);
    characteristic=await service.getCharacteristic(RX);
    enabled(true);connect.textContent='RECONECTAR';
    show('CONECTADO: '+(device.name||'Raspberry')+'\nListo para enviar órdenes.');
  }catch(e){show('Error de conexión: '+(e.message||String(e)));enabled(false)}
  finally{connect.disabled=false}
};
document.querySelectorAll('.cmd').forEach(b=>b.onclick=async()=>{
  if(!characteristic||sending)return;
  const cmd=b.dataset.cmd;
  const labels={N:'escaneo normal',P:'escaneo preciso',C:'cancelación',U:'copia USB',X:'salida al escritorio'};
  if((cmd==='N'||cmd==='P')&&!confirm('¿Iniciar '+labels[cmd]+'? La Raspberry comenzará una cuenta atrás de 10 segundos.'))return;
  if(cmd==='X'&&!confirm('¿Salir del menú LiDAR al escritorio de Ubuntu?'))return;
  sending=true;
  try{
    await characteristic.writeValue(new TextEncoder().encode(cmd));
    show('Orden enviada: '+labels[cmd]+'\nLa ejecución depende del estado del LiDAR en la pantalla táctil.');
  }catch(e){show('Error al enviar: '+(e.message||String(e)))}
  finally{sending=false}
});
</script></body></html>
